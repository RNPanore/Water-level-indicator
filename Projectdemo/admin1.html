<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; }
    .container { width: 90%; margin: 30px auto; }
    h2 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #007bff; color: #fff; }
    select { padding: 5px; }
    .notice-box {
      margin-top: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .notice-box h3 { margin-top: 0; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 10px;
      border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      margin-top: 15px; padding: 10px 15px;
      background: #28a745; color: #fff;
      border: none; border-radius: 4px; cursor: pointer;
    }
    button:hover { background: #218838; }
    .notice-list { margin-top: 20px; }
    .notice-item { border-bottom: 1px solid #ddd; padding: 10px; }
    .notice-item:last-child { border-bottom: none; }
    .delete-btn { background: #dc3545; margin-left: 10px; }
    .delete-btn:hover { background: #c82333; }
    .edit-btn { background: #ffc107; margin-left: 10px; }
    .edit-btn:hover { background: #e0a800; }
    .footer { margin-top: 30px; text-align: center; }
    .footer button { padding: 10px 15px; margin: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin Complaint Dashboard</h2>

    <!-- Complaint Table -->
    <table id="complaintTable">
      <thead>
        <tr>
          <th>Complaint ID</th>
          <th>Name</th>
          <th>Category</th>
          <th>Description</th>
          <th>Files</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Notice Management Section -->
    <div class="notice-box">
      <h3>Post / Edit Village Notice</h3>
      <input type="text" id="noticeTitle" placeholder="Notice Title">
      <textarea id="noticeContent" rows="4" placeholder="Notice Content"></textarea>
      <label>Start Date:</label>
      <input type="date" id="startDate">
      <label>End Date:</label>
      <input type="date" id="endDate">
      <button onclick="postNotice()">Publish Notice</button>
      <p id="noticeMsg"></p>

      <h3>Manage Notices</h3>
      <div id="noticeList" class="notice-list"></div>
    </div>

    <div class="footer">
      <button onclick="location.href='index1.html'">🏠 Back to Home</button>
    </div>
  </div>

  <script>
    // ---------------- Complaints ----------------
    function loadComplaints() {
      let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
      let table = document.querySelector("#complaintTable tbody");
      table.innerHTML = "";

      if(complaints.length === 0){
        table.innerHTML = "<tr><td colspan='5'>No complaints submitted yet.</td></tr>";
        return;
      }

      complaints.forEach((c, index) => {
        let row = document.createElement("tr");
        row.innerHTML = `
          <td>${c.id}</td>
          <td>${c.name}</td>
          <td>${c.category}</td>
          <td>${c.description}</td>
            <td>${c.files ? c.files.join(", ") : "No files"}</td>
          <td>
            <select onchange="updateStatus(${index}, this.value)">
              <option ${c.status==="Pending"?"selected":""}>Pending</option>
              <option ${c.status==="In Progress"?"selected":""}>In Progress</option>
              <option ${c.status==="Resolved"?"selected":""}>Resolved</option>
            </select>
          </td>
        `;
        table.appendChild(row);
      });
    }

    function updateStatus(index, newStatus) {
      let complaints = JSON.parse(localStorage.getItem("complaints")) || [];
      complaints[index].status = newStatus;
      localStorage.setItem("complaints", JSON.stringify(complaints));
      loadComplaints();
    }

    // ---------------- Notices ----------------
    let editIndex = null;

    function postNotice() {
      const title = document.getElementById("noticeTitle").value;
      const content = document.getElementById("noticeContent").value;
      const startDate = document.getElementById("startDate").value;
      const endDate = document.getElementById("endDate").value;

      if(title.trim() === "" || content.trim() === ""){
        document.getElementById("noticeMsg").innerText = "Please enter title and content.";
        return;
      }

      let notices = JSON.parse(localStorage.getItem("villageNotices")) || [];

      if(editIndex !== null) {
        notices[editIndex] = {title, content, startDate, endDate, date: new Date().toLocaleString()};
        editIndex = null;
        document.getElementById("noticeMsg").innerText = "Notice updated successfully!";
      } else {
        notices.push({title, content, startDate, endDate, date: new Date().toLocaleString()});
        document.getElementById("noticeMsg").innerText = "Notice published successfully!";
      }

      localStorage.setItem("villageNotices", JSON.stringify(notices));
      clearForm();
      loadNotices();
    }

    function loadNotices() {
      let notices = JSON.parse(localStorage.getItem("villageNotices")) || [];
      let container = document.getElementById("noticeList");
      container.innerHTML = "";

      if(notices.length === 0){
        container.innerHTML = "<p>No notices available.</p>";
        return;
      }

      notices.forEach((n, index) => {
        let div = document.createElement("div");
        div.className = "notice-item";
        div.innerHTML = `<strong>${n.title}</strong><br>${n.content}<br>
                         <small>Valid: ${n.startDate || "N/A"} to ${n.endDate || "N/A"}</small><br>
                         <small>Posted on: ${n.date}</small>
                         <button class="edit-btn" onclick="editNotice(${index})">Edit</button>
                         <button class="delete-btn" onclick="deleteNotice(${index})">Delete</button>`;
        container.appendChild(div);
      });
    }

    function deleteNotice(index) {
      let notices = JSON.parse(localStorage.getItem("villageNotices")) || [];
      notices.splice(index, 1);
      localStorage.setItem("villageNotices", JSON.stringify(notices));
      loadNotices();
    }

    function editNotice(index) {
      let notices = JSON.parse(localStorage.getItem("villageNotices")) || [];
      let n = notices[index];
      document.getElementById("noticeTitle").value = n.title;
      document.getElementById("noticeContent").value = n.content;
      document.getElementById("startDate").value = n.startDate;
      document.getElementById("endDate").value = n.endDate;
      editIndex = index;
    }

    function clearForm() {
      document.getElementById("noticeTitle").value = "";
      document.getElementById("noticeContent").value = "";
      document.getElementById("startDate").value = "";
      document.getElementById("endDate").value = "";
    }

    // Load data on page load
    loadComplaints();
    loadNotices();
  </script>
</body>
</html>
