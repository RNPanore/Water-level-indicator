<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Water Level Monitor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      /* Attractive animated gradient background */
      background: linear-gradient(270deg, #eb3c10, #4bc0eb, #e82e87, #ff9966);
      background-size: 800% 800%;
      animation: gradientShift 15s ease infinite;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    @keyframes gradientShift {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    .level-container {
      margin: 40px auto;
      width: 300px;
      height: 400px;
      border: 6px solid #fff; /* Tank border */
      border-radius: 12px;
      position: relative;
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 255, 255, 0.7);
      border-radius: 0 0 8px 8px;
      transition: height 0.5s ease;
    }
    .status {
      margin-top: 20px;
      font-size: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 40px;
      margin-top: 20px;
    }
    .switch input {
      display: none;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 40px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 32px;
      width: 32px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(40px);
    }
  </style>
</head>
<body>
  <header>💧 Water Level Monitoring Dashboard</header>

  <div class="level-container">
    <div id="water" class="water" style="height: 50%;"></div>
  </div>

  <div class="status" id="status">Current Level: 50%</div>

  <!-- Manual Control Switch -->
  <label class="switch">
    <input type="checkbox" id="manualSwitch" onchange="toggleManual()">
    <span class="slider"></span>
  </label>
  <div id="manualStatus">Manual Control: OFF</div>

  <script>
    // Simulated water level (replace with ESP8266 sensor data)
    let waterLevel = 50;

    function updateLevel(level) {
      waterLevel = level;
      document.getElementById("water").style.height = level + "%";
      document.getElementById("status").innerText = "Current Level: " + level + "%";
    }

    function toggleManual() {
      const isOn = document.getElementById("manualSwitch").checked;
      document.getElementById("manualStatus").innerText = "Manual Control: " + (isOn ? "ON" : "OFF");
      // Send ON/OFF state to ESP8266 relay here
    }

    // Example: auto-update every 5 seconds
    setInterval(() => {
      let randomLevel = Math.floor(Math.random() * 100);
      updateLevel(randomLevel);
    }, 5000);
  </script>
</body>
</html>
